name: Tests
on: [pull_request]
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: Install requirements
        run: pip install flake8 pycodestyle
      - name: Check syntax
        run: flake8 . --count --select=E901,E999,F821,F822,F823 --show-source --statistics --exclude ckan
      # - name: Run flake8
      #   run: flake8 . --count --max-line-length=127 --statistics --exclude ckan

  test:
    needs: lint
    strategy:
      matrix:
        include:
          - ckan-version: "2.9"
            ckan-image: "ckan/ckan-dev:2.9-py3.9"
            solr-version: "8"
      fail-fast: false

    name: CKAN ${{ matrix.ckan-version }}
    runs-on: ubuntu-latest
    container:
      image: ${{ matrix.ckan-image }}
      options: --user root
    services:
      solr:
        image: ckan/ckan-solr:${{ matrix.ckan-version }}-solr${{ matrix.solr-version }}
      postgres:
        image: ckan/ckan-postgres-dev:${{ matrix.ckan-version }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:3
    env:
      CKAN_SQLALCHEMY_URL: postgresql://ckan_default:pass@postgres/ckan_test
      CKAN_DATASTORE_WRITE_URL: postgresql://datastore_write:pass@postgres/datastore_test
      CKAN_DATASTORE_READ_URL: postgresql://datastore_read:pass@postgres/datastore_test
      CKAN_SOLR_URL: http://solr:8983/solr/ckan
      CKAN_REDIS_URL: redis://redis:6379/1

    steps:
      - uses: actions/checkout@v4
      - name: Install requirements
        run: |
          pip install -r requirements.txt
          pip install -r dev-requirements.txt
          pip install -e git+https://github.com/ckan/ckanext-scheming.git#egg=ckanext-scheming
          pip install -e git+https://github.com/ckan/ckanext-fluent.git@e882c241c57f80ea4e4f1d72f07f2dd64588310e#egg=ckanext-fluent
          pip install -e .
          # Replace default path to CKAN core config file with the one on the container
          sed -i -e 's/use = config:.*/use = config:\/srv\/app\/src\/ckan\/test-core.ini/' test.ini
          # Install unzip and gnupg for SonarQube Scan
          apt-get update
          apt-get install -y unzip gnupg
      - name: Setup extension (CKAN >= 2.9)
        if: ${{ matrix.ckan-version != '2.7' && matrix.ckan-version != '2.8' }}
        run: |
          ckan -c test.ini db init
      - name: Setup extension (CKAN < 2.9)
        if: ${{ matrix.ckan-version == '2.7' || matrix.ckan-version == '2.8' }}
        run: |
          paster --plugin=ckan db init -c test.ini
      - name: Run tests
        run: pytest --ckan-ini=test.ini --cov=ckanext.bostonschema --cov-report xml:coverage.xml--disable-warnings ckanext/bostonschema/tests
      - name: SonarQube Scan
        uses: sonarsource/sonarqube-scan-action@master
        with:
          args: >
            -Dsonar.projectKey=ckanext-bostonschema
            -Dsonar.sources=ckanext/bostonschema
            -Dsonar.tests=ckanext/bostonschema/tests
            -Dsonar.exclusions=ckanext/bostonschema/tests/**
            -Dsonar.python.coverage.reportPaths=coverage.xml
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_API_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_EXTERNAL_URL }}
